#configuracion del servicio
spring.application.name=ms-digitalfix-bff
server.port=${SERVER_PORT:8081}

#validacion del token con microsoft
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

#urls de los servicios internos
services.catalog.url=${SERVICES_CATALOG_URL}
services.workorders.url=${SERVICES_WORKORDERS_URL}

# documentacion swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# origenes permitidos para cors
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
