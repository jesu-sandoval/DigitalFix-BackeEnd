# configuracion del servicio
spring.application.name=ms-digitalfix-workorders
server.port=${SERVER_PORT:8083}

# conexion a la base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${WORKORDERS_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# conexion con rabbitmq
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:184.197.217.223}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}

# configuracion de hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# documentacion swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
