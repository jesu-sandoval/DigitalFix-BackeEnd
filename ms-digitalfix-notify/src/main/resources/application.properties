# Configuracion basica del servicio
spring.application.name=ms-digitalfix-notify
server.port=${SERVER_PORT:8084}

# Documentacion Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# 1. Conexion a RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:}}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
app.rabbitmq.exchanges.direct=cmd.direct
app.rabbitmq.exchanges.topic=cmd.topic
app.rabbitmq.exchanges.dlx=cmd.dead.dlx
app.rabbitmq.queues.report=q.cmd.report
app.rabbitmq.queues.report-dlq=q.cmd.report.dlq
app.rabbitmq.routing-keys.report-direct=report.gen
app.rabbitmq.routing-keys.report-topic=report.*
app.rabbitmq.routing-keys.report-dlq=report.dlq