# configuracion basica del servicio
spring.application.name=ms-digitalfix-notify
server.port=${SERVER_PORT:8084}

# documentacion swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# origenes permitidos para cors
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

#conexion con rabbitmq
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
#entrega los mensajes de uno en uno al consumidor
spring.rabbitmq.listener.simple.prefetch=1

#los nombres esta ahora alineados con las anotaciones en rabbitconfig
app.rabbitmq.exchange=cmd.direct
app.rabbitmq.exchange-topic=cmd.topic
app.rabbitmq.exchange-dlx=cmd.dead.dlx
app.rabbitmq.queue=q.cmd.report
app.rabbitmq.queue-dlq=q.cmd.report.dlq
app.rabbitmq.routing-key=report.gen
app.rabbitmq.routing-key-topic=report.*
app.rabbitmq.routing-key-dlq=report.dlq
