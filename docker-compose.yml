services:
  catalog-service:
    build:
      context: ./ms-digitalfix-catalog
      dockerfile: Dockerfile
    container_name: ms-catalog
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - DB_URL=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require
      - DB_USERNAME=postgres.gqvxvwmmjcakedurhsfz
      - DB_PASSWORD=digitalfix12123434
    networks:
      - backend-net

  workorders-service:
    build:
      context: ./ms-digitalfix-workorders
      dockerfile: Dockerfile
    container_name: ms-workorders
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - DB_URL=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require
      - DB_USERNAME=postgres.gqvxvwmmjcakedurhsfz
      - DB_PASSWORD=digitalfix12123434
    networks:
      - backend-net


  bff-service:
    build:
      context: ./ms-digitalfix-bff
      dockerfile: Dockerfile
    container_name: ms-bff
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SERVICES_CATALOG_URL=http://catalog-service:8082
      - SERVICES_WORKORDERS_URL=http://workorders-service:8083
    depends_on:
      - catalog-service
      - workorders-service
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

