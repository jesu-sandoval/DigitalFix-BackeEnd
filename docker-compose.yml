services:
  #servicio para el catalogo de productos y servicios
  catalog-service:
    build:
      context: ./ms-digitalfix-catalog
      dockerfile: Dockerfile
    container_name: ms-catalog
    restart: unless-stopped
    ports:
      - "${CATALOG_PORT:-8082}:8082"
    environment:
      - SERVER_PORT=8082
      - DB_URL=${DB_URL}
      - DB_USERNAME=${CATALOG_DB_USERNAME:-${DB_USERNAME}}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - backend-net

  #servicio para la gestion de ordenes de trabajo
  workorders-service:
    build:
      context: ./ms-digitalfix-workorders
      dockerfile: Dockerfile
    container_name: ms-workorders
    restart: unless-stopped
    ports:
      - "${WORKORDERS_PORT:-8083}:8083"
    environment:
      - SERVER_PORT=8083
      - DB_URL=${DB_URL}
      - DB_USERNAME=${WORKORDERS_DB_USERNAME:-${DB_USERNAME}}
      - DB_PASSWORD=${DB_PASSWORD}
      #conectarse a rabbitmq
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      #origenes permitidos para cors
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    networks:
      - backend-net

  #servicio bff para conectar el frontend con los microservicios
  bff-service:
    build:
      context: ./ms-digitalfix-bff
      dockerfile: Dockerfile
    container_name: ms-bff
    restart: unless-stopped
    ports:
      - "${BFF_PORT:-8081}:8081"
    environment:
      - SERVER_PORT=8081
      - SERVICES_CATALOG_URL=${SERVICES_CATALOG_URL:-http://catalog-service:8082}
      - SERVICES_WORKORDERS_URL=${SERVICES_WORKORDERS_URL:-http://workorders-service:8083}
      - JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - catalog-service
      - workorders-service
    networks:
      - backend-net
#servicio para  rabbitmq
  notify-service:
    build:
      context: ./ms-digitalfix-notify
      dockerfile: Dockerfile
    container_name: ms-notify
    restart: unless-stopped
    ports:
      - "${NOTIFY_PORT:-8084}:8084"
    environment:
      - SERVER_PORT=8084
      - PORT=8084
      - SPRING_RABBITMQ_HOST=${SPRING_RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${SPRING_RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      #origenes permitidos para cors
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    networks:
      - backend-net
#red interna de docker
networks:
  backend-net:
    driver: bridge
